syntax = "proto3";

package game_test;

message Empty {}

message Player {
	float x = 1;
	float y = 2;
	int32 move = 3;
}

message State {
	repeated Player players = 1;
}

message Input {
	double timestamp = 1;
	int32 player = 2;
	int32 move = 3;
}

message ServerMessage {
	double timestamp = 1;
	bytes state = 2;
	repeated Input inputs = 3;
}

message ClientMessage {
	double timestamp = 1;
	repeated Input inputs = 2;
}


