syntax = "proto3";

package game_turrets;

message Empty {}

message ItemInMap {
	float x = 1;
	float y = 2;
	int32 id = 3;
}

message Player {
	float x = 1;
	float y = 2;
	float vx = 3;
	float vy = 4;
	float dirX = 5;
	float dirY = 6;
	float alive = 7;
	int32 score = 8;
	float attackMunitions = 9;
	float hp = 10;
	float maxHp = 11;
	repeated int32 items = 12;
	int32 selectedItem = 13;
}

message Bullet {
	float x = 1;
	float y = 2;
	float vx = 3;
	float vy = 4;
	float a = 5;
	bool isRed = 6;
	bool fromTurret = 7;
}

message Turret {
	bool taken = 1;
	bool redTeam = 2;
	float activation = 3;
	float hp = 4;
	float itemDamage = 5;
	float pauseTimer = 6;
	float startCooldown = 7;
	float attackCooldown = 8;
	int32 itemsToSpawn = 9;
	int32 spawnIdx = 10;
}

// ---------------------------------------------------------------------------
// Entities: everything an item can spawn into the world (sliders, walls,
// balloons, troops, traps...). Each concrete type gets its own message with
// only the fields it actually needs; `Entity.etype` picks which one is set.
// ---------------------------------------------------------------------------

// A no-damage-for-everyone circle that travels in a straight line.
message EntityLifeSlider {
	float vx = 1;
	float vy = 2;
	float radius = 3;
}

// Like EntityLifeSlider, but only protects its own team.
message EntityShieldSlider {
	float vx = 1;
	float vy = 2;
	float radius = 3;
	bool redTeam = 4;
}

// A square that blocks bullets while `timer` counts down to zero.
message EntityWall {
	float timer = 1;
}

// A growing circle that explodes once it detects an enemy.
message EntityBallon {
	float radius = 1;
	bool redTeam = 2;
	bool exploded = 3;
}

// A high-HP troop charging the nearest enemy turret.
message EntityTank {
	float hp = 1;
	bool redTeam = 2;
}

// A low-HP troop that buffs the nearest friendly turret on contact.
message EntityBooster {
	float hp = 1;
	bool redTeam = 2;
	float buffTimer = 3;
}

// Attached to the player who used the item; grants a temporary effect.
message EntityStar {
	int32 playerIdx = 1;
	float timer = 2;
}

// Shared by TrapI / TrapII / TrapIII - `level` (1-3) tells them apart.
message EntityTrap {
	bool redTeam = 1;
	int32 level = 2;
	bool triggered = 3;
}

message Entity {
	float x = 1;
	float y = 2;

	oneof etype {
		EntityLifeSlider lifeSlider = 3;
		EntityShieldSlider shieldSlider = 4;
		EntityWall wall = 5;
		EntityBallon ballon = 6;
		EntityTank tank = 7;
		EntityBooster booster = 8;
		EntityStar star = 9;
		EntityTrap trap = 10;
	}
}

message State {
	repeated Player players = 1;
	repeated Turret turrets = 2;
	float time = 3;
	repeated Bullet bullets = 4;
	repeated ItemInMap items = 5;
	repeated Entity entities = 6;
}

message Throw {
	float x = 1;
	float y = 2;
}

message ItemAction {
	int32 slot = 1;
}

message QInput {
	double timestamp = 1;
	oneof action {
		float dirX = 2;
		float dirY = 3;
		Throw throwTarget = 4;
		Throw throwDir = 5;
		Empty throwAuto = 6;
		Empty throwOff = 7;
		ItemAction useItem = 8;
	}
}

message Input {
	QInput data = 1;
	float player = 2;
}

message ServerMessage {
	double timestamp = 1;
	bytes state = 2;
	repeated Input inputs = 3;
}

message ClientMessage {
	double timestamp = 1;
	repeated QInput inputs = 2;
}

message StartData {
	int32 skin = 1;
	int32 preferTeam = 2;
}

message StartPlayerInfo {
	float x = 1;
	float y = 2;
	bool isRed = 3;
}

message StartDataClient {
	repeated StartPlayerInfo players = 1;
}
