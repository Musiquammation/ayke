<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Ayke</title>
		<link rel="stylesheet" href="style.css">
		<link rel="icon" href="data:,">
	</head>
	<body>

		<div id="main" x-data="main">
			<template x-if="uses('index')">
				<div id="index-page" class="page">
					Hello World
				</div>
			</template>

			<template x-if="uses('loading')">
				<div id="loading-page" class="page">
					<div>Loading...</div>
				</div>
			</template>

			<template x-if="uses('test')">
				<div id="test-page" class="page">
					<div x-text="y0"></div>
					<div x-text="y1"></div>
					<canvas width="100" height="800"></canvas>
				</div>
			</template>

			<template x-if="uses('game-panel')">
				<div id="test-page" class="page" x-data="gamePanel">
					<h1 x-text="gamemode"></h1>
					<div x-ref="gamePanel" x-html="htmlContent"></div>
					<button x-on:click="play()">Play</button>
				</div>
			</template>

			<template x-if="uses('wait-play')">
				<div id="wait-play-page" class="page" x-data="waitPlayPanel">
					<h1>Waiting for players</h1>
					<div>
						<span>
							Allow bots?
						</span>
						<input
							type="checkbox"
							x-model="allowBots"
							@change="onAllowBotsChange()"
						>
					</div>

					<div>
						<template x-for="user in users">
							<div>
								<h2 x-html="showPseudo(user.pseudo)"></h2>
								<div>
									<span>Allow bots</span>
									<input type="checkbox" x-model="user.allowBots" disabled>
								</div>
								<template x-if="user.isBot">
									<span>
										(bot)
									</span>
								</template>
							</div>
						</template>
					</div>

					<div>
						<template x-for="log in logs">
							<div x-html="log"></div>
						</template>
					</div>
				</div>
			</template>

			<div x-show="uses('play')">
				<canvas id="play-canvas"></canvas>
			</div>
		</div>

		<script>
			window.IMG_ROOT_PATH = "";
			window.DEBUG = true;
			window.SLOW_FPS = false;
			window.SERVER_ADDRESS = "ws://localhost:8020";
			window.PROTOCOL_FILE = "/protocols/game.proto";
			window.PROTOCOLS_FOLDER = "/protocols/games/";
			window.INDEX_TS = "/src/index.ts";

			document.addEventListener("DOMContentLoaded", () => {
				import(window.INDEX_TS).then(m => {
					window.dom = m.init();
				});
			})
		</script>
	</body>
</html>
