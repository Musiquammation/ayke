        opacity="0.28"
    />

    <!-- Eyes -->
    <ellipse
        cx="62"
        cy="27"
        rx="13"
        ry="9"
        fill="#ffffff"
    />

    <ellipse
        cx="62"
        cy="73"
        rx="13"
        ry="9"
        fill="#ffffff"
    />

    <!-- Pupils -->
    <ellipse
        cx="65"
        cy="27"
        rx="6.5"
        ry="6"
        fill="#003d16"
    />

    <ellipse
        cx="65"
        cy="73"
        rx="6.5"
        ry="6"
        fill="#003d16"
    />

    <!-- Eye highlights -->
    <circle
        cx="67.5"
        cy="24.5"
        r="2.2"
        fill="#ffffff"
    />

    <circle
        cx="67.5"
        cy="70.5"
        r="2.2"
        fill="#ffffff"
    />

    <!-- Beak -->
    <path
        d="M 77 42
           Q 91 44 99 50
