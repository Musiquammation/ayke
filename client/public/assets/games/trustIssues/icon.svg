<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
	<defs>
		<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#7cc4ff"/>
			<stop offset="1" stop-color="#cfeaff"/>
		</linearGradient>
	</defs>
	<rect width="128" height="128" rx="24" fill="url(#sky)"/>
	<!-- zone beam -->
	<path d="M92 12 L104 12 L110 70 L86 70 Z" fill="#a78bfa" opacity="0.45"/>
	<rect x="82" y="68" width="32" height="8" rx="2" fill="#a78bfa" stroke="#fff" stroke-width="2"/>
	<!-- invisible platforms (dashed outlines) -->
	<rect x="52" y="84" width="22" height="6" rx="1.5" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="4 3" opacity="0.6"/>
	<rect x="60" y="56" width="18" height="6" rx="1.5" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="4 3" opacity="0.6"/>
	<!-- painted platform -->
	<rect x="24" y="96" width="24" height="7" rx="1.5" fill="#ef4444"/>
	<circle cx="30" cy="96" r="5" fill="#ef4444"/>
	<circle cx="42" cy="95" r="3.5" fill="#ef4444"/>
	<circle cx="50" cy="99" r="2" fill="#ef4444"/>
	<!-- player -->
	<rect x="30" y="74" width="12" height="20" rx="6" fill="#3b82f6"/>
	<rect x="33" y="78" width="9" height="4" rx="1" fill="#1f2937"/>
	<!-- splash -->
	<circle cx="58" cy="88" r="3" fill="#22c55e"/>
	<circle cx="66" cy="86" r="4" fill="#22c55e"/>
	<circle cx="72" cy="89" r="2.5" fill="#22c55e"/>
</svg>
