<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="-100 -100 200 200">

    <defs>
        <!-- Only show spike outlines outside the ball -->
        <clipPath id="outsideBall">
            <path
                d="
                    M -100,-100 H 100 V 100 H -100 Z
                    M 0,68
                    A 68,68 0 1 1 0,-68
                    A 68,68 0 1 1 0,68
                    Z
                "
                fill-rule="evenodd"
            />
        </clipPath>
    </defs>

    <!-- Ball -->
    <circle
        cx="0"
        cy="0"
        r="68"
        fill="#000"
        stroke="#fff"
        stroke-width="3"
    />

    <!-- Spike fills -->
    <g fill="#000">

        <!-- 0° -->
        <path d="M 66.54,-14 L 98,0 L 66.54,14 Z"/>

        <!-- 30° -->
        <path d="M 64.63,21.15 L 84.87,49 L 50.63,45.4 Z"/>

        <!-- 60° -->
        <path d="M 45.4,50.63 L 49,84.87 L 21.15,64.63 Z"/>

        <!-- 90° -->
        <path d="M 14,66.54 L 0,98 L -14,66.54 Z"/>

        <!-- 120° -->
        <path d="M -21.15,64.63 L -49,84.87 L -45.4,50.63 Z"/>

        <!-- 150° -->
        <path d="M -50.63,45.4 L -84.87,49 L -64.63,21.15 Z"/>

        <!-- 180° -->
        <path d="M -66.54,14 L -98,0 L -66.54,-14 Z"/>

        <!-- 210° -->
        <path d="M -64.63,-21.15 L -84.87,-49 L -50.63,-45.4 Z"/>

        <!-- 240° -->
        <path d="M -45.4,-50.63 L -49,-84.87 L -21.15,-64.63 Z"/>

        <!-- 270° -->
        <path d="M -14,-66.54 L 0,-98 L 14,-66.54 Z"/>

        <!-- 300° -->
        <path d="M 21.15,-64.63 L 49,-84.87 L 45.4,-50.63 Z"/>

        <!-- 330° -->
        <path d="M 50.63,-45.4 L 84.87,-49 L 64.63,-21.15 Z"/>

    </g>

    <!-- Spike outlines -->
    <g
        fill="none"
        stroke="#fff"
        stroke-width="3"
        stroke-linejoin="round"
        clip-path="url(#outsideBall)"
    >

        <path d="M 66.54,-14 L 98,0 L 66.54,14 Z"/>
        <path d="M 64.63,21.15 L 84.87,49 L 50.63,45.4 Z"/>
        <path d="M 45.4,50.63 L 49,84.87 L 21.15,64.63 Z"/>
        <path d="M 14,66.54 L 0,98 L -14,66.54 Z"/>
        <path d="M -21.15,64.63 L -49,84.87 L -45.4,50.63 Z"/>
        <path d="M -50.63,45.4 L -84.87,49 L -64.63,21.15 Z"/>
        <path d="M -66.54,14 L -98,0 L -66.54,-14 Z"/>
        <path d="M -64.63,-21.15 L -84.87,-49 L -50.63,-45.4 Z"/>
        <path d="M -45.4,-50.63 L -49,-84.87 L -21.15,-64.63 Z"/>
        <path d="M -14,-66.54 L 0,-98 L 14,-66.54 Z"/>
        <path d="M 21.15,-64.63 L 49,-84.87 L 45.4,-50.63 Z"/>
        <path d="M 50.63,-45.4 L 84.87,-49 L 64.63,-21.15 Z"/>

    </g>

    <!-- Two concentric arcs -->
    <g
        fill="none"
        stroke="#fff"
        stroke-width="3"
        stroke-linecap="round"
    >
        <path d="M 21,-16 A 18,18 0 0 1 21,16"/>
        <path d="M 16,-26 A 18,18 0 0 1 16,26"/>
    </g>

</svg>