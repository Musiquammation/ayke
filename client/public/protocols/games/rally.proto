syntax = "proto3";

package game_rally;

message Empty {}

message PlayerState {
	bool connected = 1;
	float x = 2;
	float y = 3;
	float vx = 4;
	float vy = 5;
	int32 facing = 6;
	float jumpBuffer = 7;
	float wallBoost = 8;
	float boostTimer = 9;
	float slowTimer = 10;
	float starTimer = 11;
	int32 item = 12;
	int32 pendingItem = 13;
	float itemRollTimer = 14;
	bool itemQueued = 15;
	float respawn = 16;
	int32 checkpoint = 17;
	int32 subCheckpoint = 18;
	bool hit = 19;
	int32 lapsCompleted = 20;
	bool finished = 21;
	int32 finishRank = 22;
	int32 points = 23;
	int32 finalRanking = 24;
	repeated int32 lapFinishCounts = 25;
}

message BananaThrown {
	int32 owner = 1;
	float vx = 2;
	float vy = 3;
}

message BananaState {
	int32 id = 1;
	float x = 2;
	float y = 3;
	oneof state {
		BananaThrown thrown = 10;
	}
	reserved 4 to 9;
}

// Shells do not track their owner or target.
message RedShellState {
	float vx = 1;
	float vy = 2;
	reserved 3, 4;
}

message BlueShellState {
	float vx = 1;
	float vy = 2;
	reserved 3;
}

message GreenShellState {
	float vx = 1;
	float vy = 2;
	reserved 3, 4;
}

message ShellState {
	int32 id = 1;
	float x = 2;
	float y = 3;
	oneof shell {
		RedShellState red = 10;
		BlueShellState blue = 11;
		GreenShellState green = 12;
	}
	reserved 4 to 9;
}

message BombState {
	int32 id = 1;
	float x = 2;
	float y = 3;
	float vx = 4;
	float vy = 5;
}

message ExplosionState {
	int32 id = 1;
	float x = 2;
	float y = 3;
	float remaining = 4;
	int32 itemKind = 5;
}

message State {
	repeated PlayerState players = 1;
	int32 levelIndex = 2;
	float levelTime = 3;
	int32 phase = 4;
	float intermission = 5;
	reserved 6, 7; // Removed: redScore and blueScore.
	int32 finishCount = 8;
	repeated int32 lapFinishCounts = 9;
	repeated float boxCooldowns = 10;
	repeated BananaState bananas = 11;
	repeated ShellState shells = 12;
	int32 nextEntityId = 13;
	repeated BombState bombs = 14;
	repeated ExplosionState explosions = 15;
}

message QInput {
	double timestamp = 1;
	oneof action {
		Empty jump = 2;
		Empty item = 3;
	}
}

message Input {
	QInput data = 1;
	float player = 2;
}

message ServerMessage {
	double timestamp = 1;
	bytes state = 2;
	repeated Input inputs = 3;
}

message ClientMessage {
	double timestamp = 1;
	repeated QInput inputs = 2;
}

message StartData {
	reserved 1; // Removed: preferTeam.
	// -1 means random; otherwise zero-based index into LEVELS.
	int32 choice = 2;
}

message StartDataClient {
	reserved 1; // Removed: per-player team assignments.
	// Zero means unspecified; otherwise the selected zero-based level index plus one.
	int32 selectedLevel = 2;
}
