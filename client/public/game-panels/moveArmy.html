<div x-data="data">
	<style>
		.moveArmy-team-buttons {
			display: flex;
			gap: 0.5vw;
		}

		.moveArmy-team-buttons button {
			padding: 0.5vh 1vw;
			border-radius: 0.5vh;
			border: 1px solid #888;
			background: transparent;
			cursor: pointer;
		}

		.moveArmy-team-buttons button.selected {
			background: #444;
			color: #fff;
			border-color: #fff;
		}
	</style>

	<div>
		<span>Preferred team:</span>

		<div class="moveArmy-team-buttons">
			<button type="button"
					@pointerup="preferTeam = 0"
					:class="{ selected: preferTeam === 0 }">
				None
			</button>

			<button type="button"
					@pointerup="preferTeam = 1"
					:class="{ selected: preferTeam === 1 }">
				Red
			</button>

			<button type="button"
					@pointerup="preferTeam = -1"
					:class="{ selected: preferTeam === -1 }">
				Blue
			</button>
		</div>
	</div>
</div>
