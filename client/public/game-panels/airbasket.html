<div x-data="data">
	<div>
		<span>Skin id:</span>
		<input type="number" x-model.number="skin">
	</div>

	<div>
		<span>Preferred team:</span>
		<button type="button"
				@pointerup="preferTeam = 0"
				:class="{ selected: preferTeam === 0 }">
			None
		</button>

		<button type="button"
				@pointerup="preferTeam = 1"
				:class="{ selected: preferTeam === 1 }">
			Red
		</button>

		<button type="button"
				@pointerup="preferTeam = -1"
				:class="{ selected: preferTeam === -1 }">
			Blue
		</button>
	</div>
</div>
