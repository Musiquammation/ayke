<div x-data="data">

	<style>
		.skin-select {
			position: relative;
			width: 220px;
		}

		.skin-select-button {
			box-sizing: border-box;
			width: 100%;
			height: 48px;

			display: flex;
			align-items: center;
			justify-content: space-between;

			padding: 6px 10px;

			border: 1px solid #555;
			border-radius: 6px;

			background: #222;
			color: white;

			cursor: pointer;
		}

		.skin-select-button:hover {
			background: #2d2d2d;
		}

		.skin-select-current {
			display: flex;
			align-items: center;
			gap: 10px;

			min-width: 0;
		}

		.skin-select-current span {
			overflow: hidden;
			text-overflow: ellipsis;
			white-space: nowrap;
		}

		.skin-select img {
			width: 34px;
			height: 34px;

			flex-shrink: 0;

			object-fit: contain;
		}

		.skin-select-arrow {
			margin-left: 8px;
			font-size: 11px;
			opacity: 0.7;
		}

		.skin-select-options {
			position: fixed;
			z-index: 10000;

			display: flex;
			flex-direction: column;

			box-sizing: border-box;

			max-height: 240px;
			overflow-y: auto;

			padding: 4px;

			border: 1px solid #555;
			border-radius: 6px;

			background: #222;
			box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
		}

		.skin-select-option {
			box-sizing: border-box;

			display: flex;
			align-items: center;
			gap: 10px;

			width: 100%;
			min-height: 44px;

			padding: 4px 8px;

			border-radius: 4px;

			color: white;
			cursor: pointer;
		}

		.skin-select-option:hover {
			background: #333;
		}

		.skin-select-option.selected {
			background: #444;
		}

		.skin-select-option span {
			overflow: hidden;
			text-overflow: ellipsis;
			white-space: nowrap;
		}

		.skin-select-option.disabled {
			opacity: 0.4;
			cursor: not-allowed;
			pointer-events: none;
		}

		.skin-select-option.disabled:hover {
			background: transparent;
		}

		.skin-select-options::-webkit-scrollbar {
			width: 6px;
		}

		.skin-select-options::-webkit-scrollbar-thumb {
			background: #555;
			border-radius: 3px;
		}
	</style>


	<div>
		<span>Skin:</span>

		<div
			class="skin-select"
			x-data="{ open: false }"
			@click.outside="open = false"
		>
			<button
				type="button"
				class="skin-select-button"
				@click="open = !open"
			>
				<div class="skin-select-current">
					<img
						:src="getIconPath(skin)"
						:alt="SKINS[skin]"
					>
					<span x-text="SKINS[skin]"></span>
				</div>

				<span class="skin-select-arrow" x-text="open ? '▲' : '▼'"></span>
			</button>

			<div
				class="skin-select-options"
				x-show="open"
				x-transition
			>
				<template x-for="(name, id) in SKINS" :key="id">
					<div
						class="skin-select-option"
						:class="{ selected: skin === id, disabled: !hasSkin(id) }"
						@click="skin = id; open = false"
					>
						<img
							:src="getIconPath(id)"
							:alt="name"
						>

						<span x-text="name"></span>
					</div>
				</template>
			</div>
		</div>
	</div>

	<div>
		<span>Preferred team:</span>
		<button type="button"
				@pointerup="preferTeam = 0"
				:class="{ selected: preferTeam === 0 }">
			None
		</button>

		<button type="button"
				@pointerup="preferTeam = 1"
				:class="{ selected: preferTeam === 1 }">
			Red
		</button>

		<button type="button"
				@pointerup="preferTeam = -1"
				:class="{ selected: preferTeam === -1 }">
			Blue
		</button>
	</div>
</div>
