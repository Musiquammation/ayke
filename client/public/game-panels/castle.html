<div x-data="data">
	<style>
		/* The configuration screen uses its own styles, as required by the game framework. */
		.game-castle-config {
			display: flex;
			flex-direction: column;
			gap: 2vh;
			font-family: sans-serif;
			font-size: 2vh;
		}

		.game-castle-skin-select {
			position: relative;
		}

		.game-castle-skin-select-button {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 1vw;
			min-width: 18vw;
			padding: 1vh 1vw;
		}

		.game-castle-skin-select-current,
		.game-castle-skin-select-option {
			display: flex;
			align-items: center;
			gap: 1vw;
		}

		.game-castle-skin-select-current img,
		.game-castle-skin-select-option img {
			width: 4vh;
			height: 4vh;
			image-rendering: pixelated;
		}

		.game-castle-skin-select-options {
			position: absolute;
			z-index: 3;
			top: 100%;
			left: 0;
			min-width: 18vw;
		}

		.game-castle-skin-select-option {
			padding: 1vh 1vw;
			cursor: pointer;
		}

		.game-castle-team-buttons {
			display: flex;
			gap: 1vw;
		}

		.game-castle-team-button {
			padding: 1vh 1vw;
		}
	</style>

	<div class="game-castle-config">
		<div>
			<span>Skin:</span>

			<div
				class="game-castle-skin-select"
				x-data="{ open: false }"
				@click.outside="open = false"
			>
				<button
					type="button"
					class="game-castle-skin-select-button"
					@click="open = !open"
				>
					<div class="game-castle-skin-select-current">
						<img
							:src="getIconPath(skin)"
							:alt="SKINS[skin]"
						>
						<span x-text="SKINS[skin]"></span>
					</div>

					<span x-text="open ? '▲' : '▼'"></span>
				</button>

				<div
					class="game-castle-skin-select-options"
					x-show="open"
					x-transition
				>
					<template x-for="(name, id) in SKINS" :key="id">
						<div
							class="game-castle-skin-select-option"
							:class="{ selected: skin === id, disabled: !hasSkin(id) }"
							@click="if (hasSkin(id)) { skin = id; open = false }"
						>
							<img
								:src="getIconPath(id)"
								:alt="name"
							>
							<span x-text="name"></span>
						</div>
					</template>
				</div>
			</div>
		</div>

		<div>
			<span>Preferred team:</span>
			<div class="game-castle-team-buttons">
				<button
					class="game-castle-team-button"
					type="button"
					@pointerup="preferTeam = 0"
					:class="{ selected: preferTeam === 0 }"
				>None</button>

				<button
					class="game-castle-team-button"
					type="button"
					@pointerup="preferTeam = 1"
					:class="{ selected: preferTeam === 1 }"
				>Red</button>

				<button
					class="game-castle-team-button"
					type="button"
					@pointerup="preferTeam = -1"
					:class="{ selected: preferTeam === -1 }"
				>Blue</button>
			</div>
		</div>
	</div>
</div>
