<div x-data="data">
	<div>
		<span>Skin:</span>
	</div>

	<div>
		<span>Preferred team:</span>
		<button type="button"
				@pointerup="preferTeam = 0"
				:class="{ selected: preferTeam === 0 }">
			None
		</button>

		<button type="button"
				@pointerup="preferTeam = 1"
				:class="{ selected: preferTeam === 1 }">
			Red (top)
		</button>

		<button type="button"
				@pointerup="preferTeam = -1"
				:class="{ selected: preferTeam === -1 }">
			Blue (bottom)
		</button>
	</div>
</div>
